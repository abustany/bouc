name: CI

on:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'Cargo.lock', 'rust-toolchain.toml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Check formatting
        run: treefmt --ci
        shell: nix develop --command bash -e {0}

      - name: Oxlint
        run: oxlint
        shell: nix develop --command bash -e {0}

      - name: Clippy
        run: nix build --no-link -L .#checks.x86_64-linux.bouc-clippy

      - name: Tests
        run: nix build --no-link -L .#checks.x86_64-linux.bouc

      - name: End-to-end tests
        run: nix build --no-link -L .#checks.x86_64-linux.bouc-e2e
