name: CI

on:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    permissions:
      actions: write
      attestations: write
      contents: read
      id-token: write
      packages: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'Cargo.lock', 'rust-toolchain.toml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Check formatting
        run: treefmt --ci
        shell: nix develop --command bash -e {0}

      - name: Clippy
        run: nix build --no-link -L .#checks.x86_64-linux.bouc-clippy

      - name: Typescript
        run: nix build --no-link -L .#checks.x86_64-linux.bouc-ts

      - name: Tests
        run: nix build --no-link -L .#checks.x86_64-linux.bouc

      - name: End-to-end tests
        run: nix build --no-link -L .#checks.x86_64-linux.bouc-e2e

      # --no-link: an untracked result symlink makes the flake dirty, which
      # changes the version
      - name: Build docker image
        id: image
        run: echo "path=$(nix build --no-link --print-out-paths -L .#packages.x86_64-linux.docker)" >> "$GITHUB_OUTPUT"

      - name: Push docker image
        id: push
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          tag=$(nix eval --raw .#packages.x86_64-linux.docker.imageTag)
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker load < '${{ steps.image.outputs.path }}'
          docker tag "bouc:$tag" "$IMAGE:$tag"
          docker tag "bouc:$tag" "$IMAGE:latest"
          docker push "$IMAGE:$tag"
          docker push "$IMAGE:latest"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$tag" | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest docker image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
