[package]
name = "bouc"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.91"
axum = "0.8.9"
hex = "0.4.3"
icu = { version = "2.2.0", features = ["sync"] }
jiff = "0.2.34"
jiff-icu = "0.2.2"
maud = { version = "0.27.0", features = ["axum"] }
rust-embed = { version = "8.12.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_urlencoded = "0.7.1"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread"] }
tokio-rusqlite = { version = "0.7.0", features = ["bundled"] }
