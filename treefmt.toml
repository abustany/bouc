# The formatter multiplexer - https://github.com/numtide/treefmt

# See https://github.com/numtide/treefmt-nix/tree/main/examples for examples

[formatter.nixfmt]
command = "nixfmt"
excludes = []
includes = ["*.nix"]
options = []

[formatter.oxfmt]
command = "oxfmt"
excludes = ["assets/vendor/*", "tests/testing_library/testing-library-dom-*.min.js"]
includes = [
    "*.cjs",
    "*.css",
    "*.html",
    "*.js",
    "*.json",
    "*.json5",
    "*.jsx",
    "*.md",
    "*.mdx",
    "*.mjs",
    "*.scss",
    "*.ts",
    "*.tsx",
    "*.vue",
    "*.yaml",
    "*.yml",
]
options = []

[formatter.rustfmt]
command = "rustfmt"
excludes = []
includes = ["*.rs"]
options = ["--config", "skip_children=true", "--edition", "2024"]
